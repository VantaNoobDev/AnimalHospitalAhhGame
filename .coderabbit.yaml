# CodeRabbit config for AnimalHospitalAhhGame
# docs: https://docs.coderabbit.ai/guides/review-instructions

language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false

  path_instructions:
    # ---------------------------------------------------------------
    # Network contracts
    # ---------------------------------------------------------------
    - path: "src/network/**/*.luau"
      instructions: |
        Red network contract definitions (one file per event/function).
        - `Red.Function(Name, ValidateArgs, ValidateReturn)` is a request/
          response call. Confirm every server-side `:SetCallback` consumer
          of this contract actually `return`s a value shaped like
          ValidateReturn expects — a callback that falls through without a
          return silently ships `nil` back to the client.
        - `Red.Event(Name, ValidateArgs)` is fire-and-forget. Neither side
          should expect or rely on a return value from it.
        - Every validator function should `assert` on each field it expects
          (with a descriptive message) and return the validated arguments
          unchanged. Flag validators that accept a field without asserting
          its type, and validators that transform instead of just checking.
        - Flag any name collision risk: Red enforces unique names via
          `Identifier.Exists`, so two contracts with the same string name
          will error at runtime, not compile time.

    # ---------------------------------------------------------------
    # Services — server side
    # ---------------------------------------------------------------
    - path: "src/services/**/Server.luau"
      instructions: |
        Server-side service module.
        - Any function passed to `:SetCallback(...)` on a Red.Function MUST
          end with `return`, forwarding the underlying service method's
          result (e.g. `return SomeService.Method(...)`). This is the most
          common bug in this codebase — a callback whose last line is a bare
          call instead of a return silently answers every client with `nil`.
        - Player-keyed state tables should use `setmetatable({}, { __mode =
          "k" })` (weak keys) so entries aren't leaked after a player leaves;
          flag any new `[Player]: ...` state table that skips this.
        - Every service that keeps per-player state should also expose (and
          actually call, from Server.server.luau) an `InitPlayer` and a
          `RemovePlayer`/cleanup path. Flag new state that's only ever
          initialized, never cleaned up on `PlayerRemoving`.
        - Public API functions that are also wired to a Red.Function
          callback should have the callback be a thin wrapper, not
          duplicate logic — the callback should just validate/log and
          delegate to the public function.
        - Watch for the "double-fire" pattern (firing both an internal
          `Signal` and a network Red event for the same state change) — it's
          intentional in this codebase (internal signals for other server
          services to hook, network events for the client) but flag it if a
          new instance only fires one when a symmetrical one is expected.

    # ---------------------------------------------------------------
    # Services — client side
    # ---------------------------------------------------------------
    - path: "src/services/**/Client.luau"
      instructions: |
        Client-side service module.
        - Any `SomeRedFunction:Call(...):Await()` resolves to a
          **two-value** tuple, `(Success: boolean, Result: R...)` — pcall's
          success flag plus whatever the server callback returned. Flag any
          call site that captures the result of `:Await()` into a single
          local (e.g. `local X = Foo:Call(...):Await()`); it silently
          discards the real return value and keeps only the always-true
          success flag. Correct form: `local Success, Result =
          Foo:Call(...):Await()`, with `Success` checked before `Result` is
          trusted.
        - `:Fire(...)` on a Red.Event is fire-and-forget and has no return
          value — don't flag those for the above.
        - Client modules should not mutate state received from the server
          in place unless the type is explicitly local/owned by the client
          (e.g. dedupe against `LastReplicatedValue`-style patterns used
          server-side, not client-side).
        - Every `SomeSignal:On(handler)` in these files should have a
          matching `SomeSignal = Signal.new()` exposed on the module table
          so external UI code can subscribe — flag internal-only signals
          that nothing outside the file could ever listen to.

    # ---------------------------------------------------------------
    # Central config
    # ---------------------------------------------------------------
    - path: "src/config/GameConfig.luau"
      instructions: |
        Single source of gameplay balancing values.
        - New config tables should be frozen with `table.freeze(...)` after
          the top-level `table.freeze(GameConfig)` line, matching the
          existing pattern — flag any new nested table that isn't frozen.
        - Flag hardcoded gameplay numbers appearing anywhere else in
          `src/services/**` or `src/ui/**` that duplicate a value that
          should live here instead.
        - Boolean feature flags should read as an affirmative
          ("Enabled", "AllowX", "RequireX") not a negative, to match
          existing naming.

    # ---------------------------------------------------------------
    # Startup
    # ---------------------------------------------------------------
    - path: "src/startup/*.luau"
      instructions: |
        Entry point scripts (Server.server.luau / Client.client.luau).
        - Every service required here should be `assert`-checked right
          after require, matching the existing pattern — flag a new
          `require(...)` that skips the assert.
        - `OnPlayerAdded` and `OnPlayerRemoving` handlers should stay
          symmetric: every `SomeService.InitPlayer(Player)` call added to
          the former should have a matching `SomeService.RemovePlayer(Player)`
          call added to the latter.
        - Any literal dialogue/UI text using the `_ColorKey_text_ColorKey_`
          markup syntax should use a key that actually exists in
          `src/ui/Enums/DialogueEnums.luau`'s `Colors` table — otherwise
          `DialogueMarkup.Format` will leave the raw underscores in the
          rendered text instead of coloring it.

    # ---------------------------------------------------------------
    # UI layer
    # ---------------------------------------------------------------
    - path: "src/ui/**/*.luau"
      instructions: |
        UI components, controllers, and views.
        - Views (`src/ui/Views/**`) should only touch Roblox Instances
          (GUI objects) and expose getter/setter-style functions — no
          gameplay logic or network calls belong here.
        - Controllers (`src/ui/Controllers/**`) are the only layer that
          should call `require(ReplicatedStorage.Network.X):Client()` — flag
          network requires appearing in Views or Components.
        - Any `:WaitForChild(...)` chain locating GUI instances should be
          followed by a type assertion (`:: ScreenGui`, `:: Frame`, etc.),
          matching the existing pattern in DialogueView.luau.
        - Payloads coming from `SomeRedEvent:On(handler)` should be
          defensively type-checked before use (`type(Payload) ~= "table"`
          style guard), matching DialogueController.luau — flag handlers
          that trust the payload shape without checking it.

    # ---------------------------------------------------------------
    # Project-wide Luau style
    # ---------------------------------------------------------------
    - path: "**/*.luau"
      instructions: |
        General conventions for this project:
        - PascalCase for all identifiers (variables, functions, fields) —
          flag camelCase or snake_case as a style violation, except for
          intentionally terse config keys already in use (e.g. color enum
          keys like `cs`/`rs`).
        - `--!strict` and `--!native` should be the first two lines of every
          gameplay script (services, network contracts, startup, UI).
        - Prefer `const` for bindings that are never reassigned; `local`
          should only appear when the binding is actually mutated later.
        - `read` type modifiers + `table.freeze` should be used together for
          any table meant to be immutable after construction — flag a
          `read` type on a table that's never frozen, or a frozen table
          whose type doesn't mark its fields `read`.
        - The single most common real bug class here is a missing `return`
          in a callback that's expected to produce a value (Red.Function
          `:SetCallback`, or any higher-order function taking a callback
          with a declared return type) — treat this as a high-priority flag
          wherever it appears, not just in `src/services/`.